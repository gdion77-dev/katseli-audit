<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Έλεγχος Ρύθμισης Κατσέλη — ΟλΑΠ 6/2026</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="script" data-presets="react">
const { useState, useMemo } = React;

/* ============================================================================
 *  ΜΗΧΑΝΗ ΥΠΟΛΟΓΙΣΜΟΥ (ενσωματωμένη — επαληθευμένη στο παράδειγμα ΥΠΕΘΟ)
 * ========================================================================== */

const round2 = (x) => Math.round(x * 100) / 100;

function addMonths(date, n) {
  const d = new Date(date + "T00:00:00Z");
  const day = d.getUTCDate();
  d.setUTCMonth(d.getUTCMonth() + n);
  if (d.getUTCDate() < day) d.setUTCDate(0);
  return d.toISOString().slice(0, 10);
}

function rateOn(spec, date) {
  for (const p of spec.periods) {
    const afterStart = date >= p.from;
    const beforeEnd = p.to === null || date <= p.to;
    if (afterStart && beforeEnd) return p.indexValue + p.marginPct;
  }
  const last = spec.periods[spec.periods.length - 1];
  return last ? last.indexValue + last.marginPct : 0;
}

const monthlyRate = (annualPct) => annualPct / 100 / 12;

function expandTiers(c) {
  const out = [];
  for (const t of c.tiers) for (let i = 0; i < t.months; i++) out.push(t.installment);
  return out;
}

function buildActualSchedule(c) {
  const rows = [];
  const targets = expandTiers(c);
  const payingMonths = targets.filter((t) => t > 0).length;
  let balance = c.initialPrincipal;
  let totalInterest = 0, totalPaid = 0, remainingPaying = payingMonths;
  let lastAnnual = NaN, annuity = 0;

  for (let m = 0; m < c.totalMonths; m++) {
    const date = addMonths(c.settlementStart, m);
    const annual = rateOn(c.interest, date);
    const r = monthlyRate(annual);
    const opening = balance;
    const target = targets[m] ?? targets[targets.length - 1] ?? 0;

    if (target === 0) {
      const interest = round2(opening * r);
      balance = round2(opening + interest);
      totalInterest = round2(totalInterest + interest);
      rows.push({ monthNo: m + 1, date, openingBalance: opening, interest, principal: round2(-interest), installment: 0, closingBalance: balance });
      continue;
    }
    if (annual !== lastAnnual) {
      annuity = r === 0 ? round2(balance / remainingPaying)
        : round2((balance * r) / (1 - Math.pow(1 + r, -remainingPaying)));
      lastAnnual = annual;
    }
    const interest = round2(opening * r);
    let principal = round2(annuity - interest);
    let installment = annuity;
    if (principal >= opening) { principal = opening; installment = round2(opening + interest); balance = 0; }
    else balance = round2(opening - principal);
    totalInterest = round2(totalInterest + interest);
    totalPaid = round2(totalPaid + installment);
    remainingPaying--;
    rows.push({ monthNo: m + 1, date, openingBalance: opening, interest, principal, installment, closingBalance: balance });
    if (balance <= 0) break;
  }
  return { rows, totalInterest, totalPaid };
}

function buildCorrectSchedule(c, opts) {
  const rows = [];
  const targets = expandTiers(c);
  const payingMonths = targets.filter((t) => t > 0).length;
  const fixedPrincipal = round2(c.initialPrincipal / payingMonths);
  let balance = c.initialPrincipal, totalInterest = 0, totalPaid = 0;

  for (let m = 0; m < c.totalMonths; m++) {
    const date = addMonths(c.settlementStart, m);
    const annual = rateOn(c.interest, date);
    const opening = balance;
    const tierInstallment = targets[m] ?? targets[targets.length - 1] ?? 0;
    if (tierInstallment === 0) {
      rows.push({ monthNo: m + 1, date, openingBalance: opening, interest: 0, principal: 0, installment: 0, closingBalance: opening });
      continue;
    }
    const interest = opts.interestAccrual === "perInstallment30d"
      ? round2(tierInstallment * (annual / 100) * (30 / 360))
      : round2(tierInstallment * (annual / 100) * (1 / 12));
    let principal = fixedPrincipal;
    if (principal > opening) principal = opening;
    const installment = round2(principal + interest);
    balance = round2(opening - principal);
    totalInterest = round2(totalInterest + interest);
    totalPaid = round2(totalPaid + installment);
    rows.push({ monthNo: m + 1, date, openingBalance: opening, interest, principal: round2(principal), installment, closingBalance: balance });
    if (balance <= 0) break;
  }
  return { rows, totalInterest, totalPaid };
}

function buildOverpayment(c, correct) {
  const out = [];
  const correctPaying = correct.rows.filter((r) => r.installment > 0);
  let cumulative = 0;
  const n = Math.min(c.actualPayments.length, correctPaying.length);
  for (let i = 0; i < n; i++) {
    const actual = c.actualPayments[i].amount;
    const correctInst = correctPaying[i].installment;
    const monthly = round2(actual - correctInst);
    cumulative = round2(cumulative + monthly);
    out.push({ monthNo: correctPaying[i].monthNo, date: c.actualPayments[i].date, actual, correct: correctInst, monthlyOverpayment: monthly, cumulativeOverpayment: cumulative, empty: !!c.actualPayments[i].empty });
  }
  return out;
}

function checkEligibility(gate) {
  const blockers = [];
  if (gate.framework !== "n3869_2010") blockers.push("Η ρύθμιση δεν εμπίπτει στον ν. 3869/2010 — η μέθοδος ΑΠ 6/2026 δεν εφαρμόζεται (εξωδικαστικός/4605 υπολογίζονται τοκοχρεολυτικά).");
  if (!gate.isPrimaryResidenceProtection) blockers.push("Δεν υπάρχει δικαστική απόφαση διάσωσης κύριας κατοικίας (άρθ. 9 παρ. 2).");
  if (!gate.isActiveSettlement) blockers.push("Η ρύθμιση δεν είναι ενεργή (εκπεσμένη/περατωμένη).");
  if (!gate.isDebtorConsistent) blockers.push("Ο οφειλέτης δεν είναι συνεπής — δεν θεμελιώνεται αναδρομικός συμψηφισμός.");
  return { eligible: blockers.length === 0, blockers };
}

function runAudit(c, options = {}) {
  const opts = { interestAccrual: "perInstallment30d", overpaymentTreatment: "reduceFinalInstallments", ...options };
  const actualSchedule = buildActualSchedule(c);
  const correctSchedule = buildCorrectSchedule(c, opts);
  const overpaymentBreakdown = buildOverpayment(c, correctSchedule);
  const totalOverpayment = overpaymentBreakdown.length > 0 ? overpaymentBreakdown[overpaymentBreakdown.length - 1].cumulativeOverpayment : 0;
  const interestSaved = round2(actualSchedule.totalInterest - correctSchedule.totalInterest);
  const paidCount = c.actualPayments.length;
  const correctPaying = correctSchedule.rows.filter((r) => r.installment > 0);
  const remainingBefore = Math.max(correctPaying.length - paidCount, 0);
  const goingForwardInstallment = correctPaying[paidCount]?.installment ?? correctPaying[correctPaying.length - 1]?.installment ?? 0;
  let remainingAfter = remainingBefore;
  if (totalOverpayment > 0 && goingForwardInstallment > 0) {
    const covered = Math.floor(totalOverpayment / goingForwardInstallment);
    remainingAfter = Math.max(remainingBefore - covered, 0);
  }
  return { actualSchedule, correctSchedule, overpaymentBreakdown, totalOverpayment, interestSaved, remainingInstallmentsBefore: remainingBefore, remainingInstallmentsAfter: remainingAfter, goingForwardInstallment };
}

/* ============================================================================
 *  ΒΟΗΘΗΤΙΚΑ UI
 * ========================================================================== */

const eur = (x) =>
  new Intl.NumberFormat("el-GR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 }).format(x || 0);

const C = {
  ink: "#10242b",
  petrol: "#15414c",
  petrolLight: "#1f5a68",
  paper: "#f6f3ec",
  paperDark: "#ece6d8",
  line: "#cfc7b5",
  amber: "#b5651d",
  amberSoft: "#e8d5bd",
  red: "#8a2f2f",
  green: "#2f5d3a",
  mute: "#6b6357",
};

function Field({ label, hint, children }) {
  return (
    <label style={{ display: "block", marginBottom: 14 }}>
      <span style={{ display: "block", fontSize: 12, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: C.petrol, marginBottom: 5 }}>{label}</span>
      {children}
      {hint && <span style={{ display: "block", fontSize: 11.5, color: C.mute, marginTop: 4, lineHeight: 1.4 }}>{hint}</span>}
    </label>
  );
}

const inputStyle = {
  width: "100%", boxSizing: "border-box", padding: "9px 11px", fontSize: 14,
  border: `1px solid ${C.line}`, borderRadius: 2, background: "#fff", color: C.ink,
  fontFamily: "inherit",
};

/* ============================================================================
 *  ΕΦΑΡΜΟΓΗ
 * ========================================================================== */

function App() {
  const [reference, setReference] = useState("");
  const [framework, setFramework] = useState("n3869_2010");
  const [primaryRes, setPrimaryRes] = useState(true);
  const [active, setActive] = useState(true);
  const [consistent, setConsistent] = useState(true);

  const [principal, setPrincipal] = useState(144500);
  const [start, setStart] = useState("2024-01-15");
  const [rateType, setRateType] = useState("fixed");
  const [fixedRate, setFixedRate] = useState(3.6);

  const [tiers, setTiers] = useState([{ months: 300, installment: 483, label: "κανονική" }]);
  const [accrual, setAccrual] = useState("perInstallment30d");

  // πραγματικές καταβολές: μπλοκ που επεκτείνονται σε χρονοσειρά.
  // kind: 'same' = n δόσεις ίδιου ποσού | 'empty' = n κενές (μηδενικές) |
  //       'single' = μία δόση συγκεκριμένου ποσού.
  const [payBlocks, setPayBlocks] = useState([
    { id: 1, kind: "same", count: 30, amount: 731 },
  ]);

  const [ran, setRan] = useState(false);

  const totalMonths = useMemo(() => tiers.reduce((s, t) => s + (Number(t.months) || 0), 0), [tiers]);

  const eligibility = useMemo(
    () => checkEligibility({ framework, isPrimaryResidenceProtection: primaryRes, isActiveSettlement: active, isDebtorConsistent: consistent }),
    [framework, primaryRes, active, consistent]
  );

  // επέκταση μπλοκ → επίπεδη λίστα ποσών (με flag για κενές δόσεις)
  const expandedPayments = useMemo(() => {
    const flat = [];
    for (const b of payBlocks) {
      if (b.kind === "single") {
        flat.push({ amount: Number(b.amount) || 0, empty: false });
      } else if (b.kind === "empty") {
        for (let i = 0; i < (Number(b.count) || 0); i++) flat.push({ amount: 0, empty: true });
      } else {
        for (let i = 0; i < (Number(b.count) || 0); i++) flat.push({ amount: Number(b.amount) || 0, empty: false });
      }
    }
    return flat;
  }, [payBlocks]);

  const result = useMemo(() => {
    if (!ran || !eligibility.eligible || totalMonths === 0) return null;
    const payments = expandedPayments.map((p, i) => ({
      date: addMonths(start, i), amount: p.amount, empty: p.empty,
    }));
    const c = {
      id: "case", reference,
      eligibility: { framework, isPrimaryResidenceProtection: primaryRes, isActiveSettlement: active, isDebtorConsistent: consistent },
      initialPrincipal: Number(principal), settlementStart: start, totalMonths,
      tiers: tiers.map((t) => ({ months: Number(t.months), installment: Number(t.installment), label: t.label })),
      interest: { index: rateType, periods: [{ from: addMonths(start, -1), to: null, indexValue: Number(fixedRate), marginPct: 0 }] },
      actualPayments: payments, rulingDate: "2026-06-05",
    };
    return runAudit(c, { interestAccrual: accrual });
  }, [ran, eligibility.eligible, totalMonths, reference, principal, start, rateType, fixedRate, tiers, accrual, expandedPayments, framework, primaryRes, active, consistent]);

  const updateTier = (i, key, val) => setTiers((ts) => ts.map((t, j) => (j === i ? { ...t, [key]: val } : t)));
  const addTier = () => setTiers((ts) => [...ts, { months: 12, installment: 0, label: "" }]);
  const removeTier = (i) => setTiers((ts) => ts.filter((_, j) => j !== i));

  const nextId = () => (payBlocks.reduce((m, b) => Math.max(m, b.id), 0) + 1);
  const updateBlock = (id, key, val) => setPayBlocks((bs) => bs.map((b) => (b.id === id ? { ...b, [key]: val } : b)));
  const addBlock = (kind) => setPayBlocks((bs) => [...bs, kind === "single"
    ? { id: nextId(), kind: "single", amount: 0 }
    : kind === "empty"
    ? { id: nextId(), kind: "empty", count: 1 }
    : { id: nextId(), kind: "same", count: 1, amount: 0 }]);
  const removeBlock = (id) => setPayBlocks((bs) => bs.filter((b) => b.id !== id));
  const moveBlock = (id, dir) => setPayBlocks((bs) => {
    const i = bs.findIndex((b) => b.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= bs.length) return bs;
    const copy = [...bs];
    [copy[i], copy[j]] = [copy[j], copy[i]];
    return copy;
  });
  const totalPaymentsCount = expandedPayments.length;

  return (
    <div style={{ minHeight: "100vh", background: C.paper, color: C.ink, fontFamily: "'Inter', -apple-system, system-ui, sans-serif", lineHeight: 1.5 }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:wght@500;600;700&display=swap');
        * { -webkit-font-smoothing: antialiased; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid ${C.amber}; outline-offset: 1px; }
        .num { font-variant-numeric: tabular-nums; }
        @media (max-width: 820px){ .grid2 { grid-template-columns: 1fr !important; } }
      `}</style>

      {/* HEADER */}
      <header style={{ background: C.petrol, color: C.paper, padding: "26px 28px 24px", borderBottom: `3px solid ${C.amber}` }}>
        <div style={{ maxWidth: 1080, margin: "0 auto" }}>
          <div style={{ fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", opacity: 0.75, marginBottom: 6 }}>
            ΟλΑΠ 6/2026 · ν. 3869/2010 · Επανυπολογισμός δόσεων
          </div>
          <h1 style={{ fontFamily: "'Spectral', Georgia, serif", fontSize: 30, fontWeight: 700, margin: 0, lineHeight: 1.1 }}>
            Έλεγχος Ρύθμισης Κατσέλη
          </h1>
          <p style={{ margin: "8px 0 0", fontSize: 14, opacity: 0.85, maxWidth: 620 }}>
            Αντιπαραβολή τι όρισε η δικαστική απόφαση, τι πράγματι καταβλήθηκε, και τι οφείλεται εφεξής — με αποτύπωση του υπερβάλλοντος προς επιστροφή ή συμψηφισμό.
          </p>
        </div>
      </header>

      <main style={{ maxWidth: 1080, margin: "0 auto", padding: "26px 28px 60px" }}>
        <div className="grid2" style={{ display: "grid", gridTemplateColumns: "minmax(0, 380px) 1fr", gap: 28, alignItems: "start" }}>

          {/* ---------- ΕΙΣΑΓΩΓΗ ---------- */}
          <section style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 3, padding: "20px 20px 8px" }}>
            <SectionLabel n="1" title="Στοιχεία υπόθεσης" />
            <Field label="Αναφορά / αρ. απόφασης">
              <input style={inputStyle} value={reference} onChange={(e) => setReference(e.target.value)} placeholder="π.χ. 123/2019 Ειρ. Αθηνών" />
            </Field>

            <SectionLabel n="2" title="Επιλεξιμότητα" />
            <Field label="Νομικό πλαίσιο">
              <select style={inputStyle} value={framework} onChange={(e) => setFramework(e.target.value)}>
                <option value="n3869_2010">ν. 3869/2010 (Κατσέλη)</option>
                <option value="n4738_2020">ν. 4738/2020 (Εξωδικαστικός)</option>
                <option value="n4605_2019">ν. 4605/2019</option>
                <option value="other">Άλλο</option>
              </select>
            </Field>
            <Check label="Δικαστική διάσωση κύριας κατοικίας (άρθ. 9 παρ. 2)" checked={primaryRes} onChange={setPrimaryRes} />
            <Check label="Ενεργή ρύθμιση (όχι εκπεσμένη)" checked={active} onChange={setActive} />
            <Check label="Συνεπής οφειλέτης" checked={consistent} onChange={setConsistent} />

            {!eligibility.eligible && (
              <div style={{ background: "#fbeeee", border: `1px solid ${C.red}`, borderRadius: 2, padding: "10px 12px", margin: "6px 0 16px" }}>
                <div style={{ fontWeight: 600, color: C.red, fontSize: 13, marginBottom: 4 }}>Δεν εφαρμόζεται η μέθοδος ΑΠ</div>
                <ul style={{ margin: 0, paddingLeft: 16, fontSize: 12.5, color: C.ink }}>
                  {eligibility.blockers.map((b, i) => <li key={i} style={{ marginBottom: 3 }}>{b}</li>)}
                </ul>
              </div>
            )}

            <SectionLabel n="3" title="Όροι απόφασης" />
            <Field label="Αρχικό κεφάλαιο ρύθμισης (€)">
              <input type="number" style={inputStyle} value={principal} onChange={(e) => setPrincipal(e.target.value)} />
            </Field>
            <Field label="Ημερομηνία έναρξης (1η δόση)">
              <input type="date" style={inputStyle} value={start} onChange={(e) => setStart(e.target.value)} />
            </Field>
            <Field label="Επιτόκιο" hint="Σταθερό όπως ορίστηκε από την απόφαση. Για κυμαινόμενο, χρειάζεται πίνακας τιμών ανά περίοδο (επόμενη έκδοση).">
              <div style={{ display: "flex", gap: 8 }}>
                <select style={{ ...inputStyle, flex: "0 0 130px" }} value={rateType} onChange={(e) => setRateType(e.target.value)}>
                  <option value="fixed">Σταθερό</option>
                  <option value="euribor_3m">Euribor 3μ +</option>
                </select>
                <input type="number" step="0.01" style={inputStyle} value={fixedRate} onChange={(e) => setFixedRate(e.target.value)} />
              </div>
            </Field>

            <SectionLabel n="4" title="Δομή δόσεων (step-up / περίοδος χάριτος)" />
            <div style={{ fontSize: 11.5, color: C.mute, marginBottom: 10, lineHeight: 1.45 }}>
              Κάθε σκαλοπάτι: πλήθος μηνών και ποσό δόσης. Δόση 0 = περίοδος χάριτος. Σύνολο: <strong className="num">{totalMonths}</strong> μήνες.
            </div>
            {tiers.map((t, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 6, marginBottom: 6, alignItems: "center" }}>
                <input type="number" style={{ ...inputStyle, padding: "7px 9px" }} value={t.months} onChange={(e) => updateTier(i, "months", e.target.value)} placeholder="μήνες" />
                <input type="number" style={{ ...inputStyle, padding: "7px 9px" }} value={t.installment} onChange={(e) => updateTier(i, "installment", e.target.value)} placeholder="δόση €" />
                <button onClick={() => removeTier(i)} disabled={tiers.length === 1} style={{ border: `1px solid ${C.line}`, background: C.paperDark, color: C.mute, borderRadius: 2, width: 30, height: 34, cursor: tiers.length === 1 ? "not-allowed" : "pointer", fontSize: 16 }}>×</button>
              </div>
            ))}
            <button onClick={addTier} style={{ border: `1px dashed ${C.petrolLight}`, background: "transparent", color: C.petrol, borderRadius: 2, padding: "7px 12px", fontSize: 13, fontWeight: 600, cursor: "pointer", marginBottom: 16, width: "100%" }}>+ Προσθήκη σκαλοπατιού</button>

            <SectionLabel n="5" title="Πραγματικές καταβολές" />
            <div style={{ fontSize: 11.5, color: C.mute, marginBottom: 10, lineHeight: 1.45 }}>
              Πρόσθεσε μπλοκ με τη σειρά που εμφανίζονται στην καρτέλα του servicer. Σύνολο: <strong className="num">{totalPaymentsCount}</strong> καταβολές.
            </div>
            {payBlocks.map((b, idx) => (
              <PaymentBlock
                key={b.id} block={b} index={idx} total={payBlocks.length}
                onUpdate={updateBlock} onRemove={removeBlock} onMove={moveBlock}
                canRemove={payBlocks.length > 1}
              />
            ))}
            <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
              <AddBtn onClick={() => addBlock("same")}>+ Ίδιες δόσεις</AddBtn>
              <AddBtn onClick={() => addBlock("single")}>+ Μεμονωμένη</AddBtn>
              <AddBtn onClick={() => addBlock("empty")}>+ Κενές</AddBtn>
            </div>

            <Field label="Μέθοδος τόκου (νέα)" hint="Το ευνοϊκό σενάριο ΥΠΕΘΟ υπολογίζει τόκο μόνο για 30 ημέρες κάθε δόσης.">
              <select style={inputStyle} value={accrual} onChange={(e) => setAccrual(e.target.value)}>
                <option value="perInstallment30d">Τόκος επί δόσης — 30 ημέρες (ΥΠΕΘΟ)</option>
                <option value="fullPeriod">Τόκος επί δόσης — πλήρης μήνας</option>
              </select>
            </Field>

            <button
              onClick={() => setRan(true)}
              disabled={!eligibility.eligible || totalMonths === 0}
              style={{ width: "100%", marginTop: 6, marginBottom: 14, padding: "13px", background: eligibility.eligible && totalMonths > 0 ? C.amber : C.line, color: "#fff", border: "none", borderRadius: 2, fontSize: 15, fontWeight: 700, letterSpacing: "0.02em", cursor: eligibility.eligible && totalMonths > 0 ? "pointer" : "not-allowed" }}
            >
              Υπολογισμός μελέτης
            </button>
          </section>

          {/* ---------- ΑΠΟΤΕΛΕΣΜΑΤΑ ---------- */}
          <section>
            {!result ? (
              <Empty eligible={eligibility.eligible} />
            ) : (
              <Results result={result} reference={reference} accrual={accrual} />
            )}
          </section>
        </div>
      </main>
    </div>
  );
}

function SectionLabel({ n, title }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "18px 0 12px", paddingBottom: 6, borderBottom: `1px solid ${C.paperDark}` }}>
      <span style={{ fontFamily: "'Spectral', serif", fontSize: 13, fontWeight: 700, color: "#fff", background: C.petrol, width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 2 }}>{n}</span>
      <span style={{ fontSize: 13.5, fontWeight: 700, color: C.ink }}>{title}</span>
    </div>
  );
}

function Check({ label, checked, onChange }) {
  return (
    <label style={{ display: "flex", alignItems: "flex-start", gap: 9, marginBottom: 9, cursor: "pointer", fontSize: 13.5 }}>
      <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} style={{ marginTop: 2, width: 16, height: 16, accentColor: C.petrol }} />
      <span>{label}</span>
    </label>
  );
}

function AddBtn({ onClick, children }) {
  return (
    <button onClick={onClick} style={{ flex: "1 1 auto", border: `1px dashed ${C.petrolLight}`, background: "transparent", color: C.petrol, borderRadius: 2, padding: "7px 8px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
      {children}
    </button>
  );
}

const KIND_META = {
  same: { tag: "Ίδιες", color: C.petrol },
  single: { tag: "Μεμονωμένη", color: C.amber },
  empty: { tag: "Κενές", color: C.red },
};

function PaymentBlock({ block, index, total, onUpdate, onRemove, onMove, canRemove }) {
  const meta = KIND_META[block.kind];
  const miniInput = { ...inputStyle, padding: "6px 8px", fontSize: 13 };
  return (
    <div style={{ border: `1px solid ${C.line}`, borderLeft: `3px solid ${meta.color}`, borderRadius: 2, padding: "9px 10px", marginBottom: 7, background: C.paper }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 7 }}>
        <span style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em", color: meta.color }}>
          #{index + 1} · {meta.tag}
        </span>
        <span style={{ display: "flex", gap: 3 }}>
          <IconBtn disabled={index === 0} onClick={() => onMove(block.id, -1)} title="Πάνω">↑</IconBtn>
          <IconBtn disabled={index === total - 1} onClick={() => onMove(block.id, 1)} title="Κάτω">↓</IconBtn>
          <IconBtn disabled={!canRemove} onClick={() => onRemove(block.id)} title="Διαγραφή">×</IconBtn>
        </span>
      </div>
      {block.kind === "single" ? (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 12.5, color: C.mute, whiteSpace: "nowrap" }}>Ποσό €</span>
          <input type="number" style={miniInput} value={block.amount} onChange={(e) => onUpdate(block.id, "amount", e.target.value)} />
        </div>
      ) : block.kind === "empty" ? (
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <input type="number" style={{ ...miniInput, width: 80, flex: "0 0 80px" }} value={block.count} onChange={(e) => onUpdate(block.id, "count", e.target.value)} />
          <span style={{ fontSize: 12.5, color: C.mute }}>μήνες χωρίς καταβολή (0 €)</span>
        </div>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <input type="number" style={{ ...miniInput, width: 64, flex: "0 0 64px" }} value={block.count} onChange={(e) => onUpdate(block.id, "count", e.target.value)} />
          <span style={{ fontSize: 12.5, color: C.mute, whiteSpace: "nowrap" }}>δόσεις ×</span>
          <input type="number" style={miniInput} value={block.amount} onChange={(e) => onUpdate(block.id, "amount", e.target.value)} />
          <span style={{ fontSize: 12.5, color: C.mute }}>€</span>
        </div>
      )}
    </div>
  );
}

function IconBtn({ children, onClick, disabled, title }) {
  return (
    <button onClick={onClick} disabled={disabled} title={title}
      style={{ width: 24, height: 24, border: `1px solid ${C.line}`, background: disabled ? C.paperDark : "#fff", color: disabled ? C.line : C.mute, borderRadius: 2, cursor: disabled ? "not-allowed" : "pointer", fontSize: 13, lineHeight: 1, padding: 0 }}>
      {children}
    </button>
  );
}

function Empty({ eligible }) {
  return (
    <div style={{ border: `1px dashed ${C.line}`, borderRadius: 3, padding: "60px 30px", textAlign: "center", color: C.mute, background: "rgba(255,255,255,0.4)" }}>
      <div style={{ fontFamily: "'Spectral', serif", fontSize: 20, color: C.petrol, marginBottom: 8 }}>Η μελέτη εμφανίζεται εδώ</div>
      <p style={{ fontSize: 14, maxWidth: 360, margin: "0 auto" }}>
        {eligible
          ? "Συμπλήρωσε τους όρους της απόφασης και τις καταβολές, μετά πάτησε «Υπολογισμός μελέτης»."
          : "Διόρθωσε πρώτα τα σημεία επιλεξιμότητας στα αριστερά."}
      </p>
    </div>
  );
}

/* ---------- ΑΠΟΤΕΛΕΣΜΑΤΑ ---------- */

function Results({ result, reference, accrual }) {
  const { actualSchedule, correctSchedule, overpaymentBreakdown, totalOverpayment, interestSaved, remainingInstallmentsBefore, remainingInstallmentsAfter, goingForwardInstallment } = result;
  const monthsSaved = remainingInstallmentsBefore - remainingInstallmentsAfter;
  const firstActual = actualSchedule.rows.find((r) => r.installment > 0)?.installment || 0;
  const firstCorrect = correctSchedule.rows.find((r) => r.installment > 0)?.installment || 0;

  return (
    <div>
      {/* KPI */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 20 }}>
        <Kpi label="Υπερβάλλον προς επιστροφή / συμψηφισμό" value={eur(totalOverpayment)} accent />
        <Kpi label="Δόση εφεξής (κατά ΑΠ)" value={eur(goingForwardInstallment)} />
        <Kpi label="Μείωση αποπληρωμής" value={`${monthsSaved} δόσεις`} sub={`${remainingInstallmentsBefore} → ${remainingInstallmentsAfter}`} />
        <Kpi label="Διαφορά συνολικών τόκων" value={eur(interestSaved)} />
      </div>

      {/* ΣΥΓΚΡΙΣΗ ΔΟΣΗΣ */}
      <Panel title="Σύγκριση δόσης — παλιά vs νέα μέθοδος">
        <div style={{ display: "flex", gap: 0, alignItems: "stretch", border: `1px solid ${C.line}`, borderRadius: 2, overflow: "hidden" }}>
          <CompareCol title="Παλιά μέθοδος" subtitle="τόκος επί άληκτου κεφαλαίου" amount={eur(firstActual)} totalLabel="Σύνολο τόκων" total={eur(actualSchedule.totalInterest)} tone="red" />
          <CompareCol title="Μέθοδος ΑΠ 6/2026" subtitle="τόκος επί της μηνιαίας δόσης" amount={eur(firstCorrect)} totalLabel="Σύνολο τόκων" total={eur(correctSchedule.totalInterest)} tone="green" />
        </div>
      </Panel>

      {/* ΥΠΕΡΒΑΛΛΟΝ ΓΡΑΦΗΜΑ */}
      {overpaymentBreakdown.length > 0 && (
        <Panel title="Σωρευτικό υπερβάλλον ανά καταβολή">
          <OverpaymentChart rows={overpaymentBreakdown} />
        </Panel>
      )}

      {/* ΠΙΝΑΚΑΣ ΥΠΕΡΒΑΛΛΟΝΤΟΣ */}
      {overpaymentBreakdown.length > 0 && (
        <Panel title="Ανάλυση υπερβάλλοντος">
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ background: C.paperDark }}>
                  <Th>Μήνας</Th><Th>Ημ/νία</Th><Th right>Καταβλήθηκε</Th><Th right>Ορθή δόση</Th><Th right>Διαφορά</Th><Th right>Σωρευτικό</Th>
                </tr>
              </thead>
              <tbody>
                {overpaymentBreakdown.slice(0, 60).map((r, i) => (
                  <tr key={i} style={{ borderBottom: `1px solid ${C.paperDark}`, background: r.empty ? "rgba(138,47,47,0.04)" : "transparent" }}>
                    <Td>{r.monthNo}</Td><Td>{r.date}</Td>
                    <Td right>{r.empty ? <span style={{ color: C.red, fontSize: 11.5, fontStyle: "italic" }}>κενή</span> : eur(r.actual)}</Td>
                    <Td right>{eur(r.correct)}</Td>
                    <Td right tone={r.monthlyOverpayment > 0 ? C.red : C.green}>{eur(r.monthlyOverpayment)}</Td>
                    <Td right bold>{eur(r.cumulativeOverpayment)}</Td>
                  </tr>
                ))}
              </tbody>
            </table>
            {overpaymentBreakdown.length > 60 && <div style={{ fontSize: 12, color: C.mute, padding: "8px 4px" }}>… και άλλες {overpaymentBreakdown.length - 60} γραμμές</div>}
          </div>
        </Panel>
      )}

      {/* ΑΙΤΗΣΗ */}
      <Panel title="Κείμενο αιτήματος προς servicer">
        <ClaimText reference={reference} result={result} accrual={accrual} />
      </Panel>
    </div>
  );
}

function Kpi({ label, value, sub, accent }) {
  return (
    <div style={{ background: accent ? C.petrol : "#fff", color: accent ? "#fff" : C.ink, border: `1px solid ${accent ? C.petrol : C.line}`, borderRadius: 3, padding: "14px 15px" }}>
      <div style={{ fontSize: 11, letterSpacing: "0.03em", textTransform: "uppercase", opacity: accent ? 0.8 : 0.65, marginBottom: 6, lineHeight: 1.3, color: accent ? "#fff" : C.mute }}>{label}</div>
      <div className="num" style={{ fontFamily: "'Spectral', serif", fontSize: 24, fontWeight: 700, lineHeight: 1, color: accent ? "#fff" : C.petrol }}>{value}</div>
      {sub && <div className="num" style={{ fontSize: 12, marginTop: 4, opacity: 0.7 }}>{sub}</div>}
    </div>
  );
}

function Panel({ title, children }) {
  return (
    <div style={{ background: "#fff", border: `1px solid ${C.line}`, borderRadius: 3, marginBottom: 18, overflow: "hidden" }}>
      <div style={{ background: C.paperDark, padding: "9px 15px", fontSize: 13, fontWeight: 700, color: C.ink, borderBottom: `1px solid ${C.line}` }}>{title}</div>
      <div style={{ padding: 15 }}>{children}</div>
    </div>
  );
}

function CompareCol({ title, subtitle, amount, totalLabel, total, tone }) {
  const col = tone === "red" ? C.red : C.green;
  return (
    <div style={{ flex: 1, padding: "16px 18px", borderLeft: tone === "green" ? `1px solid ${C.line}` : "none" }}>
      <div style={{ fontSize: 13, fontWeight: 700, color: col, marginBottom: 2 }}>{title}</div>
      <div style={{ fontSize: 11.5, color: C.mute, marginBottom: 12 }}>{subtitle}</div>
      <div style={{ fontSize: 11, color: C.mute, textTransform: "uppercase", letterSpacing: "0.03em" }}>1η δόση</div>
      <div className="num" style={{ fontFamily: "'Spectral', serif", fontSize: 28, fontWeight: 700, color: C.ink, marginBottom: 12 }}>{amount}</div>
      <div style={{ fontSize: 11, color: C.mute, textTransform: "uppercase", letterSpacing: "0.03em" }}>{totalLabel}</div>
      <div className="num" style={{ fontSize: 17, fontWeight: 600, color: col }}>{total}</div>
    </div>
  );
}

function OverpaymentChart({ rows }) {
  const w = 640, h = 200, pad = { l: 56, r: 12, t: 12, b: 26 };
  const max = Math.max(...rows.map((r) => r.cumulativeOverpayment), 1);
  const n = rows.length;
  const x = (i) => pad.l + (i / Math.max(n - 1, 1)) * (w - pad.l - pad.r);
  const y = (v) => pad.t + (1 - v / max) * (h - pad.t - pad.b);
  const path = rows.map((r, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(r.cumulativeOverpayment).toFixed(1)}`).join(" ");
  const area = `${path} L${x(n - 1).toFixed(1)},${(h - pad.b).toFixed(1)} L${x(0).toFixed(1)},${(h - pad.b).toFixed(1)} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="Σωρευτικό υπερβάλλον">
      {[0, 0.5, 1].map((f) => (
        <g key={f}>
          <line x1={pad.l} x2={w - pad.r} y1={y(max * f)} y2={y(max * f)} stroke={C.paperDark} />
          <text x={pad.l - 6} y={y(max * f) + 3} textAnchor="end" fontSize="10" fill={C.mute}>{eur(max * f)}</text>
        </g>
      ))}
      <path d={area} fill={C.amberSoft} opacity="0.6" />
      <path d={path} fill="none" stroke={C.amber} strokeWidth="2" />
      <text x={pad.l} y={h - 8} fontSize="10" fill={C.mute}>1η</text>
      <text x={w - pad.r} y={h - 8} fontSize="10" fill={C.mute} textAnchor="end">{n}η καταβολή</text>
    </svg>
  );
}

function Th({ children, right }) {
  return <th style={{ textAlign: right ? "right" : "left", padding: "8px 10px", fontSize: 11.5, fontWeight: 700, color: C.petrol, textTransform: "uppercase", letterSpacing: "0.03em", whiteSpace: "nowrap" }}>{children}</th>;
}
function Td({ children, right, bold, tone }) {
  return <td className={typeof children === "number" || right ? "num" : ""} style={{ textAlign: right ? "right" : "left", padding: "7px 10px", color: tone || C.ink, fontWeight: bold ? 700 : 400, whiteSpace: "nowrap" }}>{children}</td>;
}

function ClaimText({ reference, result, accrual }) {
  const { totalOverpayment, goingForwardInstallment, remainingInstallmentsBefore, remainingInstallmentsAfter, interestSaved } = result;
  const monthsSaved = remainingInstallmentsBefore - remainingInstallmentsAfter;
  const text = `Θέμα: Επανυπολογισμός δόσεων ρύθμισης ν. 3869/2010 κατ' εφαρμογή της υπ' αριθμ. 6/2026 αποφάσεως της Πλήρους Ολομέλειας του Αρείου Πάγου${reference ? ` (υπόθεση: ${reference})` : ""}

Αξιότιμοι κύριοι,

Κατ' εφαρμογή της υπ' αριθμ. 6/2026 αποφάσεως της Πλήρους Ολομέλειας του Αρείου Πάγου, ο τόκος της δικαστικής ρυθμίσεως του άρθρου 9 παρ. 2 του ν. 3869/2010 υπολογίζεται επί της μηνιαίας δόσεως και όχι επί του συνολικού άληκτου κεφαλαίου.

Βάσει επανυπολογισμού των καταβολών:

• Συνολικό υπερβάλλον που έχει καταβληθεί: ${eur(totalOverpayment)}
• Διαφορά συνολικών τόκων υπέρ του οφειλέτη: ${eur(interestSaved)}
• Ορθή μηνιαία δόση εφεξής: ${eur(goingForwardInstallment)}
• Εναπομένουσες δόσεις μετά συμψηφισμό: ${remainingInstallmentsAfter} (μείωση κατά ${monthsSaved} δόσεις)

Αιτούμαστε τον συμψηφισμό του ως άνω υπερβάλλοντος ποσού με τις επόμενες δόσεις της ρυθμίσεως, την επικαιροποίηση του δοσολογίου με ορθό υπολογισμό τόκου, και τη χορήγηση επικαιροποιημένης βεβαιώσεως οφειλής.

Με εκτίμηση,`;

  const [copied, setCopied] = useState(false);
  const copy = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); });
  };
  return (
    <div>
      <textarea readOnly value={text} style={{ width: "100%", boxSizing: "border-box", minHeight: 220, padding: 12, fontSize: 12.5, fontFamily: "ui-monospace, Menlo, monospace", border: `1px solid ${C.line}`, borderRadius: 2, background: C.paper, color: C.ink, lineHeight: 1.5, resize: "vertical" }} />
      <button onClick={copy} style={{ marginTop: 10, padding: "9px 16px", background: C.petrol, color: "#fff", border: "none", borderRadius: 2, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
        {copied ? "Αντιγράφηκε ✓" : "Αντιγραφή κειμένου"}
      </button>
    </div>
  );
}



const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(React.createElement(App));
  </script>
</body>
