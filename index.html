<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Έλεγχος Ρύθμισης Κατσέλη — ΟλΑΠ 6/2026</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module" src="./App.jsx"></script>
  <script type="text/babel" data-presets="react">
    // Περιμένει να φορτωθεί το App.jsx και το εμφανίζει στη σελίδα.
    const waitForApp = () => {
      if (window.__App) {
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(window.__App));
      } else {
        setTimeout(waitForApp, 50);
      }
    };
    waitForApp();
  </script>
</body>
</html>
